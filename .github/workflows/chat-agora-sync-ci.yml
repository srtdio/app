name: Chat Agora Sync

# Runs the chat-agora-sync Worker (A2b) unit suite. Agora REST and the supabase
# client (reads + chat_channel_mark_synced rpc) are mocked - calls are asserted,
# not live network or DB state - so no local Supabase stack is needed, mirroring
# the chat-webhook-mirror suite.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # changes: on a PR, diffs against the merge base with the PR's base branch and
  # sets run=true only when a changed file matches PATTERNS below. A push to main
  # always runs.
  # Imports behind the list: src/server/workers/chat-agora-sync.test.ts imports
  # chat-agora-sync.ts, chat-agora-rest.ts, agora-identity.ts,
  # src/server/logger.ts, trace.ts and traced-fetch.ts; it runs under the root
  # vitest.config.ts.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect suite-relevant changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # One extended regex per line, matched against each changed path.
          PATTERNS: |
            ^supabase/migrations/
            ^supabase/seed
            ^packages/schemas/src/supabase\.generated\.ts$
            ^\.github/workflows/chat\-agora\-sync-ci\.yml$
            ^src/server/workers/chat-agora-sync
            ^src/server/workers/chat-agora-rest\.ts$
            ^src/server/workers/agora-identity\.ts$
            ^src/server/logger\.ts$
            ^src/server/trace\.ts$
            ^src/server/traced-fetch\.ts$
            ^vitest\.config\.ts$
            ^package\.json$
            ^pnpm-lock\.yaml$
            ^pnpm-workspace\.yaml$
            ^tsconfig\.json$
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "push: whole suite"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          printf '%s\n' "$PATTERNS" | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/patterns"
          if hits=$(grep -E -f "$RUNNER_TEMP/patterns" <<< "$files"); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "relevant:"
            echo "$hits"
          else
            rc=$?
            if [ "$rc" -ne 1 ]; then exit "$rc"; fi
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  chat-agora-sync:
    needs: changes
    # Always reports, so the required check never waits on a skipped job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.run }}
    steps:
      - name: Check change detection
        if: needs.changes.result != 'success'
        run: |
          set -euo pipefail
          echo "changes job: ${{ needs.changes.result }}"
          exit 1

      - name: Skip note
        if: env.RUN != 'true'
        run: |
          echo "skipped: no relevant files changed"

      - uses: actions/checkout@v4
        if: env.RUN == 'true'

      - uses: pnpm/action-setup@v4
        if: env.RUN == 'true'

      - uses: actions/setup-node@v4
        if: env.RUN == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: env.RUN == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run chat-agora-sync worker suite
        if: env.RUN == 'true'
        run: pnpm exec vitest run src/server/workers/chat-agora-sync.test.ts
