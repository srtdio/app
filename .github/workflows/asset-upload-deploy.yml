name: Deploy asset-upload Worker

on:
  push:
    branches: [main]
    paths:
      - 'workers/asset-upload/**'
      - 'src/server/workers/asset-upload.ts'
      - 'src/server/assets/**'
      - 'packages/storage/**'
      - '.github/workflows/asset-upload-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Deploy first, then sync secrets. Test-site preview uploads (see
      # preview-deploy.yml) leave an undeployed latest version, and Cloudflare
      # rejects secret edits until the latest version is the deployed one.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/asset-upload
          wranglerVersion: '3.114.17'
          packageManager: pnpm
      - name: Sync secrets
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/asset-upload
          wranglerVersion: '3.114.17'
          packageManager: pnpm
          command: deployments status
          secrets: |
            CLOUDFLARE_ACCOUNT_ID
            CLOUDFLARE_R2_ACCESS_KEY_ID
            CLOUDFLARE_R2_SECRET_ACCESS_KEY
            CLOUDFLARE_ANALYTICS_ACCOUNT_ID
            CLOUDFLARE_ANALYTICS_TOKEN
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ANALYTICS_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ANALYTICS_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
