name: Regenerate Supabase Types

on:
  workflow_dispatch:

concurrency:
  group: types-regen
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  types-regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate Supabase types from the live database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: pnpm types:supabase
      - name: Open a PR with the regenerated types
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: packages/schemas/src/supabase.generated.ts
          branch: chore/regen-supabase-types
          delete-branch: true
          base: main
          commit-message: 'chore: regenerate Supabase types from live database'
          title: 'Regenerate Supabase types from live database'
          body: |
            Machine-generated update of `packages/schemas/src/supabase.generated.ts`.

            This reflects the current live public schema (including any new
            functions and partition tables) and is produced by `pnpm types:supabase`.
            Do not hand-edit; rerun the Regenerate Supabase Types workflow instead.
