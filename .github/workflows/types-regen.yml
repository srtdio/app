name: Regenerate Supabase Types

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches:
      - trigger/types-regen

concurrency:
  group: types-regen
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  types-regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate Supabase types from the live database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: pnpm types:supabase
      - name: Sync regenerated types to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/schemas/src/supabase.generated.ts
          if git diff --cached --quiet -- packages/schemas/src/supabase.generated.ts; then
            echo 'No type changes to sync.'
            exit 0
          fi
          git commit -m 'chore: sync Supabase types from live database'
          git push origin HEAD:main
      - name: Clean up trigger branch
        if: github.event_name == 'push'
        run: git push origin --delete trigger/types-regen || true
