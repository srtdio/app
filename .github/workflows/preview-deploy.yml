name: Preview Deploy

# Every pull request gets its own Cloudflare Pages preview at
# https://pr-<number>.srtdio-app.pages.dev so changes can be clicked through
# before merging to main. Production (branch main) is untouched; the preview
# reuses the same v2 Supabase project as staging.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # Fork PRs have no access to secrets.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          VITE_SENTRY_DSN_FRONTEND: ${{ secrets.SENTRY_DSN_FRONTEND }}
          VITE_SENTRY_ENVIRONMENT: preview
          VITE_SENTRY_RELEASE: ${{ github.event.pull_request.head.sha }}
          VITE_ASSET_READ_URL: ${{ vars.VITE_ASSET_READ_URL }}
          VITE_ASSET_UPLOAD_URL: ${{ vars.VITE_ASSET_UPLOAD_URL }}
          VITE_AVATAR_UPLOAD_URL: ${{ vars.VITE_AVATAR_UPLOAD_URL }}
          VITE_CHAT_TOKEN_URL: ${{ vars.VITE_CHAT_TOKEN_URL }}
          VITE_CHAT_TRANSCRIBE_URL: ${{ vars.VITE_CHAT_TRANSCRIBE_URL }}
          VITE_SITE_MEDIA_URL: ${{ vars.VITE_SITE_MEDIA_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CI: true
      - name: Deploy preview to Cloudflare Pages
        run: pnpm wrangler pages deploy dist --project-name srtdio-app --branch "$PREVIEW_BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- preview-deploy -->';
            const url = `https://${process.env.PREVIEW_BRANCH}.srtdio-app.pages.dev`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\nPreview: ${url}\n\nBuilt from \`${sha}\`. Updates on every push to this PR.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
