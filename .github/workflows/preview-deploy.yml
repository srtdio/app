name: Preview Deploy

# Every pull request gets its own Cloudflare Pages preview at
# https://pr-<number>.srtdio-app.pages.dev so changes can be clicked through
# before merging to main. Production (branch main) is untouched; the preview
# reuses the same v2 Supabase project as staging.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    # Fork PRs have no access to secrets.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      PREVIEW_BRANCH: pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each browser-facing Worker gets a preview version built from this PR,
      # served at https://pr-<n>-<worker>.<subdomain>.workers.dev. Uploading a
      # version never changes what the live Worker serves; secrets and bindings
      # carry over from the live version. If an upload fails, the preview falls
      # back to the live Worker and the PR comment says so.
      - name: Upload preview versions of the Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          : > "$RUNNER_TEMP/preview-workers.md"
          for pair in avatar-upload:VITE_AVATAR_UPLOAD_URL asset-upload:VITE_ASSET_UPLOAD_URL \
                      asset-read:VITE_ASSET_READ_URL chat-token:VITE_CHAT_TOKEN_URL \
                      chat-transcribe:VITE_CHAT_TRANSCRIBE_URL; do
            dir="${pair%%:*}"
            var="${pair#*:}"
            out="$(cd "workers/$dir" && pnpm dlx wrangler@4.140.0 versions upload \
              --preview-alias "$PREVIEW_BRANCH" --message "Preview for PR #$PR_NUMBER" 2>&1)" || true
            url="$(printf '%s\n' "$out" | sed -n 's/.*Version Preview Alias URL: \(https:[^ ]*\).*/\1/p' | head -n 1)"
            if [ -n "$url" ]; then
              echo "PREVIEW_$var=$url" >> "$GITHUB_ENV"
              echo "- $dir: preview copy from this PR" >> "$RUNNER_TEMP/preview-workers.md"
            else
              printf '%s\n' "$out"
              echo "::warning::$dir preview upload failed; the preview uses the live Worker"
              echo "- $dir: live version (preview upload failed, see the Preview Deploy log)" >> "$RUNNER_TEMP/preview-workers.md"
            fi
          done
      - name: Build
        run: pnpm build
        env:
          VITE_SENTRY_DSN_FRONTEND: ${{ secrets.SENTRY_DSN_FRONTEND }}
          # src/lib/env.ts only accepts development | production; any other
          # value fails env validation and blanks every page past the homepage.
          VITE_SENTRY_ENVIRONMENT: development
          VITE_SENTRY_RELEASE: ${{ github.event.pull_request.head.sha }}
          VITE_ASSET_READ_URL: ${{ env.PREVIEW_VITE_ASSET_READ_URL || vars.VITE_ASSET_READ_URL }}
          VITE_ASSET_UPLOAD_URL: ${{ env.PREVIEW_VITE_ASSET_UPLOAD_URL || vars.VITE_ASSET_UPLOAD_URL }}
          VITE_AVATAR_UPLOAD_URL: ${{ env.PREVIEW_VITE_AVATAR_UPLOAD_URL || vars.VITE_AVATAR_UPLOAD_URL }}
          VITE_CHAT_TOKEN_URL: ${{ env.PREVIEW_VITE_CHAT_TOKEN_URL || vars.VITE_CHAT_TOKEN_URL }}
          VITE_CHAT_TRANSCRIBE_URL: ${{ env.PREVIEW_VITE_CHAT_TRANSCRIBE_URL || vars.VITE_CHAT_TRANSCRIBE_URL }}
          VITE_SITE_MEDIA_URL: ${{ vars.VITE_SITE_MEDIA_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          CI: true
      - name: Deploy preview to Cloudflare Pages
        run: pnpm wrangler pages deploy dist --project-name srtdio-app --branch "$PREVIEW_BRANCH"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- preview-deploy -->';
            const url = `https://${process.env.PREVIEW_BRANCH}.srtdio-app.pages.dev`;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const fs = require('fs');
            const workers = fs.readFileSync(`${process.env.RUNNER_TEMP}/preview-workers.md`, 'utf8').trim();
            const body = `${marker}\nPreview: ${url}\n\nBuilt from \`${sha}\`. Updates on every push to this PR.\n\nBackend services used by this preview:\n${workers}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
