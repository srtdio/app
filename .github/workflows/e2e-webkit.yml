name: E2E WebKit

# Renders the e2e/harness Vite entry in Playwright WebKit with iPhone 13
# emulation (every spec in dark, @theme specs in light too). The WebKit build is
# cached per @playwright/test version; the report and e2e/results are uploaded
# on failure only. Linux WebKit is close to, not identical to, iOS Safari. No
# database, no secrets.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  e2e-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright WebKit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps webkit

      - name: Install Playwright WebKit system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps webkit

      - name: Type-check the e2e workspace
        run: pnpm exec tsc -p e2e/tsconfig.json --noEmit

      - name: Run WebKit e2e suite
        run: pnpm test:e2e

      - name: Upload report and results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit-results
          path: |
            e2e/results
            playwright-report
          if-no-files-found: warn
          retention-days: 14
