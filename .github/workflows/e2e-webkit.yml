name: E2E WebKit

# changes: diffs against the merge base with main (push: previous commit) and picks what to run: nothing for non-UI paths or unit tests only, the matching specs for homepage-only or spec-only PRs (one job), the whole suite for anything else and for every push to main.
#   On a PR, src/server/ (Workers) never reaches the harness and runs nothing; package.json or pnpm-lock.yaml run the whole suite only when a dependency the UI imports changed (see Detect UI-relevant changes).
# webkit-shard: runs the Playwright WebKit iPhone suite (e2e/harness, no DB, no secrets; every spec dark, @theme specs light too), the whole suite in 6 parallel shards of 2 workers each (see playwright.config.ts).
# e2e-typecheck: on a UI change, type-checks the e2e workspace in parallel with the shards.
# e2e-webkit: the required check; fails if any shard or the typecheck failed or was cancelled, passes on success or skip.
# No workflow-level paths filter, so the required check always reports. Linux WebKit is close to, not identical to, iOS Safari.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-webkit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
      specs: ${{ steps.diff.outputs.specs }}
      shards: ${{ steps.diff.outputs.shards }}
      shard_total: ${{ steps.diff.outputs.shard_total }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List changed files
        id: files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin main
            base=$(git merge-base origin/main HEAD)
          else
            base="$BEFORE_SHA"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=$(git rev-parse HEAD~1)
            fi
          fi
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          cat "$RUNNER_TEMP/changed.txt"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          # The spec selector (scripts/ci/e2e-select.ts) needs Node 22 and the
          # TypeScript compiler: install only for a PR that touches src/ outside
          # src/server/ (a push to main runs the whole suite without it).
          if [ "$EVENT_NAME" = "pull_request" ] && grep -E '^src/' "$RUNNER_TEMP/changed.txt" | grep -qvE '^src/server/'; then
            echo "select=true" >> "$GITHUB_OUTPUT"
          else
            echo "select=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.files.outputs.select == 'true'

      - uses: actions/setup-node@v4
        if: steps.files.outputs.select == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.files.outputs.select == 'true'
        run: pnpm install --frozen-lockfile

      - name: Detect UI-relevant changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ steps.files.outputs.base }}
        run: |
          set -euo pipefail
          base="$BASE"
          files=$(cat "$RUNNER_TEMP/changed.txt")
          # Pick the specs a change can affect. Other src/ files on a PR go to
          # the import-closure selector (scripts/ci/e2e-select.ts); anything
          # else not listed below can reach every screen, so it runs the whole
          # suite; a push to main always runs the whole suite. Each rule logs
          # the file it decided as "rule: file -> what runs".
          ui=false
          all=false
          deps=false
          specs=""
          sel=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # Worker code is a separate build target the harness never imports.
            case "$f" in
              src/server/*) if [ "$EVENT_NAME" = "pull_request" ]; then continue; fi ;;
            esac
            if ! echo "$f" | grep -qE '^(src/|e2e/|public/|index\.html$|package\.json$|pnpm-lock\.yaml$|playwright\.config\.ts$|vite\.config\.ts$|tailwind\.config\.ts$|postcss\.config\.js$|tsconfig[^/]*\.json$|\.github/workflows/e2e-webkit\.yml$)'; then
              continue
            fi
            ui=true
            case "$f" in
              # Unit tests never reach the browser.
              src/*.test.ts|src/*.test.tsx|src/__tests__/*) echo "unit test: $f -> nothing" ;;
              # An edited spec runs itself (a deleted one runs nothing).
              e2e/tests/*.spec.ts) if [ -f "$f" ]; then specs="$specs $f"; echo "spec-only: $f -> itself"; fi ;;
              # Homepage bundle, except the files the app shell imports.
              src/components/home/HomeGate.tsx|src/components/home/guest-path.ts|src/components/home/Wordmark.tsx) all=true; echo "homepage shell file: $f -> whole suite" ;;
              src/components/home/*|e2e/harness/home.html|e2e/harness/home-fixture.tsx) specs="$specs e2e/tests/home-pages.spec.ts"; echo "homepage-only: $f -> e2e/tests/home-pages.spec.ts" ;;
              # Decided below from which dependencies changed.
              package.json|pnpm-lock.yaml) deps=true ;;
              # Decided below by the import-closure selector.
              src/*) if [ "$EVENT_NAME" = "pull_request" ]; then sel="$sel $f"; else all=true; fi ;;
              *) all=true; echo "other UI file: $f -> whole suite" ;;
            esac
          done <<< "$files"
          # src/ UI files on a PR: the specs of every area whose import closure
          # holds a changed file (scripts/ci/e2e-areas.ts); the app shell,
          # shared UI, CSS, and any file no area reaches run the whole suite.
          # A selector failure runs the whole suite.
          if [ -n "$sel" ] && [ "$all" != true ]; then
            if picked=$(node --experimental-strip-types --no-warnings scripts/ci/e2e-select.ts $sel); then
              if [ "$picked" = "ALL" ]; then
                all=true
                echo "selector: whole suite"
              else
                specs="$specs $(echo $picked)"
                echo "selector: $(echo ${picked:-no specs})"
              fi
            else
              all=true
              echo "selector failed: whole suite"
            fi
          fi
          if [ "$ui" = true ] && [ "$EVENT_NAME" != "pull_request" ]; then all=true; fi
          # package.json / pnpm-lock.yaml on a PR: the whole suite only when a
          # dependency the UI uses changed. "Used" = imported (or url()'d) by
          # src/ outside src/server/ and tests, e2e/, or the root build configs,
          # plus the toolchain those configs name, and @types/<x> for a used x.
          # A changed non-dependency field (scripts, engines, pnpm, ...), a
          # changed lockfile header, or a lockfile change with no importer
          # change (transitive only) cannot be attributed, so it runs the suite.
          if [ "$deps" = true ] && [ "$EVENT_NAME" = "pull_request" ] && [ "$all" != true ]; then
            # diff exits 1 when the inputs differ; only 2 (trouble) is an error.
            ldiff() { diff "$@" || [ "$?" -eq 1 ]; }
            pj_deps() { jq -r '[.dependencies, .devDependencies, .optionalDependencies, .peerDependencies] | map(. // {} | to_entries[] | "\(.key) \(.value)") | .[]' | sort; }
            lock_header() { sed '/^importers:/,$d'; }
            lock_importers() {
              awk '
                /^packages:/ { exit }
                /^  [^ ].*:$/ { imp = $1; sub(/:$/, "", imp); next }
                /^      [^ ].*:$/ { dep = $1; sub(/:$/, "", dep); next }
                /^        (specifier|version):/ { print imp " " dep " " $1 " " $2 }
              ' | sed "s/'//g" | sort
            }
            changed=""
            if grep -qx 'package.json' <<< "$files"; then
              changed="$changed $(ldiff <(git show "$base:package.json" | pj_deps) <(pj_deps < package.json) | sed -n 's/^[<>] \([^ ]*\) .*/\1/p' | tr '\n' ' ')"
              if [ "$(git show "$base:package.json" | jq -S 'del(.dependencies, .devDependencies, .optionalDependencies, .peerDependencies)')" != "$(jq -S 'del(.dependencies, .devDependencies, .optionalDependencies, .peerDependencies)' package.json)" ]; then
                echo "package.json: a non-dependency field changed"
                all=true
              fi
            fi
            if grep -qx 'pnpm-lock.yaml' <<< "$files"; then
              if [ "$(git show "$base:pnpm-lock.yaml" | lock_header)" != "$(lock_header < pnpm-lock.yaml)" ]; then
                echo "pnpm-lock.yaml: header (settings/overrides) changed"
                all=true
              fi
              imp_diff=$(ldiff <(git show "$base:pnpm-lock.yaml" | lock_importers) <(lock_importers < pnpm-lock.yaml) | sed -n 's/^[<>] \([^ ]*\) \([^ ]*\) .*/\1 \2/p' | sort -u)
              if [ -z "$imp_diff" ]; then
                echo "pnpm-lock.yaml: transitive-only change"
                all=true
              fi
              while read -r imp dep; do
                [ -z "$imp" ] && continue
                if [ "$imp" = "." ]; then
                  changed="$changed $dep"
                elif [ -f "$imp/package.json" ]; then
                  # A workspace package's own dependency reaches the UI through that package.
                  changed="$changed $dep $(jq -r .name "$imp/package.json")"
                else
                  changed="$changed $dep"
                fi
              done <<< "$imp_diff"
            fi
            used=$(git grep -hoE "(^|[[:space:]}])(from|import|@import|url\()[[:space:]]*\(?[[:space:]]*['\"][^'\"./][^'\"]*['\"]" -- src e2e index.html vite.config.ts tailwind.config.ts playwright.config.ts ':!src/server/**' ':!*.test.ts' ':!*.test.tsx' ':!src/__tests__/**' \
              | sed -E "s/.*['\"]([^'\"]+)['\"]$/\1/" | grep -vE '^(@/|[a-z]+:)' | sed -E 's#^(@[^/]+/[^/]+|[^@/][^/]*).*#\1#' | sort -u)
            used=$(printf '%s\n' "$used" tailwindcss postcss autoprefixer typescript vite @playwright/test node | sort -u)
            changed=$(printf '%s\n' $changed | sort -u | tr '\n' ' ')
            echo "dependencies changed: $changed"
            for dep in $changed; do
              name="$dep"
              case "$dep" in
                @types/*__*) scoped="${dep#@types/}"; name="@${scoped/__//}" ;;
                @types/*) name="${dep#@types/}" ;;
              esac
              if grep -qxF -- "$name" <<< "$used"; then
                echo "UI dependency changed: $dep"
                all=true
              fi
            done
          fi
          specs=$(echo "$specs" | tr ' ' '\n' | sort -u | tr '\n' ' ' | sed 's/^ *//;s/ *$//')
          if [ "$all" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "specs=" >> "$GITHUB_OUTPUT"
            echo "shards=[1,2,3,4,5,6]" >> "$GITHUB_OUTPUT"
            echo "shard_total=6" >> "$GITHUB_OUTPUT"
            echo "WebKit: whole suite"
          elif [ -n "$specs" ]; then
            # About six specs per shard, up to the whole suite's six shards.
            n=$(echo $specs | wc -w)
            total=$(( (n + 5) / 6 ))
            if [ "$total" -gt 6 ]; then total=6; fi
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "specs=$specs" >> "$GITHUB_OUTPUT"
            echo "shards=[$(seq -s, 1 "$total")]" >> "$GITHUB_OUTPUT"
            echo "shard_total=$total" >> "$GITHUB_OUTPUT"
            echo "WebKit: $n specs in $total shards: $specs"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  webkit-shard:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Room for a slow apt mirror: the system-deps install alone has taken
    # 14 minutes on some runners, which left the tests no time under 15.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright WebKit
        timeout-minutes: 18
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps webkit

      - name: Install Playwright WebKit system dependencies
        timeout-minutes: 18
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps webkit

      - name: Run WebKit e2e shard
        timeout-minutes: 10
        env:
          SPECS: ${{ needs.changes.outputs.specs }}
          SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.shard_total }}
        # SPECS is unquoted on purpose: one argument per spec path.
        run: pnpm test:e2e --shard="$SHARD" $SPECS

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit-results-${{ matrix.shard }}
          path: |
            e2e/results
            playwright-report
          if-no-files-found: warn
          retention-days: 7

  e2e-typecheck:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check the e2e workspace
        run: pnpm exec tsc -p e2e/tsconfig.json --noEmit

  e2e-webkit:
    needs: [changes, webkit-shard, e2e-typecheck]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check shard and typecheck results
        env:
          SHARD_RESULT: ${{ needs.webkit-shard.result }}
          TYPECHECK_RESULT: ${{ needs.e2e-typecheck.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          echo "changes: $CHANGES_RESULT, webkit-shard: $SHARD_RESULT, e2e-typecheck: $TYPECHECK_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then exit 1; fi
          case "$SHARD_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
          case "$TYPECHECK_RESULT" in
            failure|cancelled) exit 1 ;;
          esac

      - name: Skip note
        if: needs.changes.outputs.run != 'true'
        run: |
          echo "skipped: no relevant files changed"
