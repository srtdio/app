name: E2E WebKit

# changes: diffs against the merge base with main (push: previous commit) and outputs run=true only for UI-relevant paths.
# webkit-shard: on a UI change, runs the Playwright WebKit iPhone suite (e2e/harness, no DB, no secrets) in 3 parallel shards.
# e2e-webkit: the required check; fails if any shard failed or was cancelled, passes on success or skip, and type-checks e2e on a UI change.
# No workflow-level paths filter, so the required check always reports. Linux WebKit is close to, not identical to, iOS Safari.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect UI-relevant changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin main
            base=$(git merge-base origin/main HEAD)
          else
            base="$BEFORE_SHA"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=$(git rev-parse HEAD~1)
            fi
          fi
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          if echo "$files" | grep -qE '^(src/|e2e/|public/|index\.html$|package\.json$|pnpm-lock\.yaml$|playwright\.config\.ts$|vite\.config\.ts$|tailwind\.config\.ts$|postcss\.config\.js$|tsconfig[^/]*\.json$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  webkit-shard:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright WebKit
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install webkit

      - name: Install WebKit system deps
        run: pnpm exec playwright install-deps webkit

      - name: Run WebKit e2e shard
        run: pnpm test:e2e --shard=${{ matrix.shard }}/3

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit-results-${{ matrix.shard }}
          path: |
            e2e/results
            playwright-report
          if-no-files-found: warn
          retention-days: 7

  e2e-webkit:
    needs: [changes, webkit-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check shard results
        env:
          SHARD_RESULT: ${{ needs.webkit-shard.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          echo "changes: $CHANGES_RESULT, webkit-shard: $SHARD_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then exit 1; fi
          case "$SHARD_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac

      - name: Skip note
        if: needs.changes.outputs.run != 'true'
        run: echo "no UI change, WebKit suite skipped"

      - uses: actions/checkout@v4
        if: needs.changes.outputs.run == 'true'

      - uses: pnpm/action-setup@v4
        if: needs.changes.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: needs.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Type-check the e2e workspace
        if: needs.changes.outputs.run == 'true'
        run: pnpm exec tsc -p e2e/tsconfig.json --noEmit
