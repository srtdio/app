name: E2E WebKit

# changes: diffs against the merge base with main (push: previous commit) and outputs run=true only for UI-relevant paths.
# webkit-shard: on a UI change, runs the Playwright WebKit iPhone suite (e2e/harness, no DB, no secrets; every spec dark, @theme specs light too) in 6 parallel shards of 2 workers each (see playwright.config.ts).
# e2e-typecheck: on a UI change, type-checks the e2e workspace in parallel with the shards.
# e2e-webkit: the required check; fails if any shard or the typecheck failed or was cancelled, passes on success or skip.
# No workflow-level paths filter, so the required check always reports. Linux WebKit is close to, not identical to, iOS Safari.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-webkit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect UI-relevant changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin main
            base=$(git merge-base origin/main HEAD)
          else
            base="$BEFORE_SHA"
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base=$(git rev-parse HEAD~1)
            fi
          fi
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          if echo "$files" | grep -qE '^(src/|e2e/|public/|index\.html$|package\.json$|pnpm-lock\.yaml$|playwright\.config\.ts$|vite\.config\.ts$|tailwind\.config\.ts$|postcss\.config\.js$|tsconfig[^/]*\.json$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  webkit-shard:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright WebKit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps webkit

      - name: Install Playwright WebKit system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps webkit

      - name: Run WebKit e2e shard
        run: pnpm test:e2e --shard=${{ matrix.shard }}/6

      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit-results-${{ matrix.shard }}
          path: |
            e2e/results
            playwright-report
          if-no-files-found: warn
          retention-days: 7

  e2e-typecheck:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check the e2e workspace
        run: pnpm exec tsc -p e2e/tsconfig.json --noEmit

  e2e-webkit:
    needs: [changes, webkit-shard, e2e-typecheck]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check shard and typecheck results
        env:
          SHARD_RESULT: ${{ needs.webkit-shard.result }}
          TYPECHECK_RESULT: ${{ needs.e2e-typecheck.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: |
          echo "changes: $CHANGES_RESULT, webkit-shard: $SHARD_RESULT, e2e-typecheck: $TYPECHECK_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then exit 1; fi
          case "$SHARD_RESULT" in
            success|skipped) ;;
            *) exit 1 ;;
          esac
          case "$TYPECHECK_RESULT" in
            failure|cancelled) exit 1 ;;
          esac

      - name: Skip note
        if: needs.changes.outputs.run != 'true'
        run: echo "no UI change, WebKit suite skipped"
