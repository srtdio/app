name: ETL

# Type-checks the @srtdio/etl package and test workspace, runs the ETL boundary
# suite (transform mappings + config safety guards), then runs the offline
# --dry-run self-check. All steps are pure: no database is ever reached and no
# live migration is run. Mirrors posts-ci.yml / rls-ci.yml structure.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # changes: on a PR, diffs against the merge base with the PR's base branch and
  # sets run=true only when a changed file matches PATTERNS below. A push to main
  # always runs.
  # Imports behind the list: tests/etl and the dry-run import @srtdio/etl and
  # @srtdio/storage; tests/etl/tsconfig.json also type-checks scripts/gen-emoji-
  # data.ts.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect suite-relevant changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          # One extended regex per line, matched against each changed path.
          PATTERNS: |
            ^supabase/migrations/
            ^supabase/seed
            ^packages/schemas/src/supabase\.generated\.ts$
            ^tests/etl/
            ^\.github/workflows/etl-ci\.yml$
            ^packages/etl/
            ^packages/storage/
            ^scripts/gen-emoji-data\.ts$
            ^package\.json$
            ^pnpm-lock\.yaml$
            ^pnpm-workspace\.yaml$
            ^tsconfig\.json$
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "push: whole suite"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_REF"
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          files=$(git diff --name-only "$base" HEAD)
          echo "$files"
          printf '%s\n' "$PATTERNS" | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/patterns"
          if hits=$(grep -E -f "$RUNNER_TEMP/patterns" <<< "$files"); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "relevant:"
            echo "$hits"
          else
            rc=$?
            if [ "$rc" -ne 1 ]; then exit "$rc"; fi
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  etl:
    needs: changes
    # Always reports, so the required check never waits on a skipped job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      RUN: ${{ needs.changes.outputs.run }}
    steps:
      - name: Check change detection
        if: needs.changes.result != 'success'
        run: |
          set -euo pipefail
          echo "changes job: ${{ needs.changes.result }}"
          exit 1

      - name: Skip note
        if: env.RUN != 'true'
        run: |
          echo "skipped: no relevant files changed"

      - uses: actions/checkout@v4
        if: env.RUN == 'true'

      - uses: pnpm/action-setup@v4
        if: env.RUN == 'true'

      - uses: actions/setup-node@v4
        if: env.RUN == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: env.RUN == 'true'
        run: pnpm install --frozen-lockfile

      - name: Type-check the etl package and test workspace
        if: env.RUN == 'true'
        run: pnpm exec tsc -p tests/etl/tsconfig.json --noEmit

      - name: Run etl suite
        if: env.RUN == 'true'
        run: pnpm exec vitest run --config tests/etl/vitest.config.ts

      # Offline transform self-check. No SOURCE/TARGET env is set, so the run
      # never connects to a database and never executes a migration.
      - name: Dry-run transform self-check (no database)
        if: env.RUN == 'true'
        run: pnpm --filter @srtdio/etl run etl -- --dry-run
