name: ETL Run (manual)

# Manually-triggered runner for the @srtdio/etl migration. workflow_dispatch
# ONLY: this never fires on push or pull_request. Mirrors etl-ci.yml for the
# Node 22 + pnpm setup. Secrets are passed via env and never echoed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Migration mode
        type: choice
        options:
          - dev-seed
          - cutover
        default: dev-seed
      dry_run:
        description: Run without writing to the target
        type: boolean
        default: true
      operator_email:
        description: Operator email
        type: string
        required: true
      operator_display_name:
        description: Operator display name
        type: string
        required: true
      workspace_name:
        description: Target workspace name
        type: string
        required: true
      confirm_cutover:
        description: Confirm cutover (only used when mode=cutover)
        type: boolean
        default: false

jobs:
  etl-run:
    runs-on: ubuntu-latest
    steps:
      - name: Guard cutover confirmation
        if: ${{ inputs.mode == 'cutover' && !inputs.confirm_cutover }}
        run: |
          echo "::error::mode=cutover requires confirm_cutover=true. Refusing to run."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ETL migration
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
          TARGET_DATABASE_URL: ${{ secrets.TARGET_DATABASE_URL }}
          EXPECTED_TARGET_REF: movnexawfhsyuluspxoc
          OPERATOR_USER_ID: 7b54b9a8-5ac4-4600-8012-7f21320cea8f
          OPERATOR_EMAIL: ${{ inputs.operator_email }}
          OPERATOR_DISPLAY_NAME: ${{ inputs.operator_display_name }}
          TARGET_WORKSPACE_NAME: ${{ inputs.workspace_name }}
          TARGET_WORKSPACE_TIMEZONE: Asia/Kolkata
        run: pnpm --filter @srtdio/etl etl --mode="${{ inputs.mode }}" ${{ inputs.dry_run && '--dry-run' || '' }} ${{ (inputs.mode == 'cutover' && inputs.confirm_cutover) && '--confirm-cutover' || '' }}
