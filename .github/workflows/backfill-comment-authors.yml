name: Backfill comment authors (manual)

# Manually-triggered, one-time idempotent backfill of legacy comment-author
# attribution for the cutover workspace. workflow_dispatch ONLY: never fires on
# push or pull_request. dry-run (default) reports counts and writes nothing;
# apply wraps a temp staging table + one set-based UPDATE in a single transaction
# and aborts on any ambiguous match. Mirrors etl-run.yml for Node 22 + pnpm setup
# and reuses the same v1/v2 connection + target-workspace secrets. Secrets are
# passed via env and never echoed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Backfill mode
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

jobs:
  backfill-comment-authors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run comment-author backfill
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
          TARGET_DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          EXPECTED_TARGET_REF: movnexawfhsyuluspxoc
          TARGET_WORKSPACE_NAME: ${{ secrets.TARGET_WORKSPACE_NAME }}
        run: pnpm --filter @srtdio/etl etl backfill-comment-authors --mode="${{ inputs.mode }}"
