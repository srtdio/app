name: RLS Isolation

# Spins up a local Supabase stack, applies supabase/migrations/, and runs the
# cross-tenant RLS isolation suite. Independent of schema-drift.yml.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # psql is used by rls-enabled.test.ts to read pg_class.relrowsecurity.
      - name: Ensure psql is available
        run: psql --version || sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Type-check the RLS test workspace
        run: pnpm exec tsc -p tests/rls/tsconfig.json --noEmit

      - name: Run RLS isolation suite
        run: pnpm exec vitest run --config tests/rls/vitest.config.ts

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup || true
