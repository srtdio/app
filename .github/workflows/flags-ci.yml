name: Feature Flags E2E

# Spins up a local Supabase stack, applies supabase/migrations/, and runs the
# feature-flag read/write/eval e2e suite (tests/flags). Mirrors rls-ci.yml;
# independent of the unit `test` job in ci.yml, which never reaches a database.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Available for parity with the RLS suite's local-stack tooling.
      - name: Ensure psql is available
        run: psql --version || sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Type-check the flags test workspace
        run: pnpm exec tsc -p tests/flags/tsconfig.json --noEmit

      - name: Run feature-flag e2e suite
        run: pnpm exec vitest run --config tests/flags/vitest.config.ts

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup || true
