name: Visual CI

# visual: renders every screen in e2e/visual/screens.spec.ts (iPhone 13 light and dark, 1280x800 light; WebKit, harness, no DB, no secrets) and compares each with its committed baseline in e2e/visual/__screenshots__/. Any screen over 0.2% different fails; the diff, actual and expected images upload as the visual-diffs artifact.
#   Runs on every pull request and every push to main (no paths filter, so the check always reports).
# Baseline refresh: on a pull request from this repo whose head commit message contains [update-visual-baselines], visual renders with --update-snapshots on this CI WebKit image and uploads the visual-baselines artifact,
#   then commit-baselines commits them to the PR's head branch. That push is made with GITHUB_TOKEN, so it starts no new run: push any later commit (without the tag) to get the visual check on it.
# Locally: pnpm exec playwright test --config e2e/visual/playwright.visual.config.ts (add --update-snapshots to refresh; local baselines differ from CI's, commit only CI-rendered ones).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: visual-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    # Room for a slow apt mirror (see e2e-webkit.yml): the system-deps install
    # alone has taken 14 minutes on some runners.
    timeout-minutes: 30
    outputs:
      update: ${{ steps.mode.outputs.update }}
    steps:
      - name: Choose compare or baseline refresh
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          update=false
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" = "$REPO" ]; then
            message=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq .commit.message)
            if printf '%s' "$message" | grep -qF '[update-visual-baselines]'; then
              update=true
            fi
          fi
          echo "update=$update" >> "$GITHUB_OUTPUT"
          echo "baseline refresh: $update"

      # A refresh renders the PR head itself (the commit the baselines land on);
      # a compare renders what checkout gives (the merge commit on a PR).
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.mode.outputs.update == 'true' && github.event.pull_request.head.sha || '' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright WebKit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install webkit

      # The system packages come from the runner's apt mirror, which has been
      # slow enough (about 50 KB/s) to eat the whole job. Keep the downloaded
      # .deb files in the Actions cache so later runs install them offline.
      - name: Cache WebKit system packages
        id: deb-cache
        uses: actions/cache@v4
        with:
          path: ~/webkit-debs
          key: webkit-debs-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright WebKit system dependencies
        timeout-minutes: 18
        run: |
          set -euo pipefail
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-debs
          mkdir -p ~/webkit-debs
          if compgen -G "$HOME/webkit-debs/*.deb" > /dev/null; then
            sudo cp ~/webkit-debs/*.deb /var/cache/apt/archives/
          fi
          pnpm exec playwright install-deps webkit
          if [ "${{ steps.deb-cache.outputs.cache-hit }}" != 'true' ]; then
            cp /var/cache/apt/archives/*.deb ~/webkit-debs/ 2>/dev/null || true
          fi

      - name: Compare screens with the baselines
        if: steps.mode.outputs.update != 'true'
        timeout-minutes: 15
        run: pnpm exec playwright test --config e2e/visual/playwright.visual.config.ts

      - name: Render new baselines
        if: steps.mode.outputs.update == 'true'
        timeout-minutes: 15
        run: pnpm exec playwright test --config e2e/visual/playwright.visual.config.ts --update-snapshots

      - name: Upload new baselines
        if: steps.mode.outputs.update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: e2e/visual/__screenshots__
          if-no-files-found: error
          retention-days: 7

      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            e2e/results/visual
            e2e/results/visual-report
          if-no-files-found: warn
          retention-days: 7

  # Runs no PR code: it only copies the rendered images onto the head branch.
  commit-baselines:
    needs: visual
    if: needs.visual.outputs.update == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      # Replace the project folders only (the .gitkeep stays).
      - name: Clear the old baselines
        run: find e2e/visual/__screenshots__ -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +

      - uses: actions/download-artifact@v4
        with:
          name: visual-baselines
          path: e2e/visual/__screenshots__

      - name: Commit the baselines to the PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A e2e/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "baselines unchanged: nothing to commit"
            exit 0
          fi
          git commit -m "Visual CI: refresh baselines on the CI WebKit image"
          git push origin "HEAD:$HEAD_REF"
