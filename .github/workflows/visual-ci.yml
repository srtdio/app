name: Visual CI

# select: picks the screens this change can change (scripts/ci/visual-select.ts --pr, the same selection pnpm prepush uses), per screen:
#   a changed src/ or packages/ file runs the screens whose entry in e2e/visual/screen-files.json (the screen-to-files map the nightly run
#   records) holds it, plus new screens of its areas; a file in no entry, or no map, falls back to the area rule (scripts/ci/e2e-areas.ts).
#   Nothing for docs, scripts, Workers, unit tests and the like. A pull request never runs ALL and never more than 20 screens (ONE_SHARD_MAX,
#   one shard): past the cap, or for a global file (CSS, fonts, tokens, tailwind / vite config, the app shell, layout-checks*.ts,
#   playwright.visual.config.ts, shared code in screens.spec.ts, package.json, pnpm-lock.yaml, ...), an unknown file or a selection error, it
#   runs the selected screens first, then one smoke screen per area not yet covered, cut at 20. The log names the true radius and the run.
#   The whole set renders once a night on main (visual-nightly.yml, 02:30 IST), which refreshes the baselines and the map through one bot PR
#   (branch bot/visual-baselines, "Visual baselines refresh").
# visual-shard: renders the selected screens (iPhone 13 light and dark, 1280x800 light, four ipad-* tablet projects; WebKit, harness, no DB, no secrets)
#   plus the parts gallery screens (gallery-<Part>) in Chromium on a Pixel 7 (chrome-phone); the same screens also run in phone-360 and
#   phone-320 (iPhone 13 at 360 and 320 wide), which run the layout checks only: no screenshot, no baseline, nothing to refresh or upload;
#   and compares each with its committed baseline in e2e/visual/__screenshots__/. Any screen over 0.2% different fails; the diff, actual
#   and expected images upload as the visual-diffs-1 artifact.
# visual: the one required check. Passes when the shard succeeded, or when nothing was selected (no shard runs).
#   Runs on every pull request (no paths filter, so the check always reports). No push-to-main run: the nightly covers main.
# Baseline refresh: on a pull request from this repo whose head commit message contains [update-visual-baselines] and whose author is not a bot
#   (loop guard: the bot commit's message never carries the tag, and a bot-authored head never renders), the shard re-renders the screens this
#   PR renders (--update-snapshots=all) on this CI WebKit image, compares them again on the same tree, and uploads only the files it rendered as
#   visual-baselines-1. Baselines of screens not run are never touched; a PR never clears the whole set.
#   commit-baselines lays them over the PR's head branch and commits them. With the Sorted CI GitHub App (secrets SORTED_CI_APP_ID and
#   SORTED_CI_APP_PRIVATE_KEY; the token is scoped to this repository, contents: write) the push is the App's, so every PR workflow runs on the bot
#   commit for real. Without those secrets it commits as github-actions[bot] with [skip ci] in the message and pushes with GITHUB_TOKEN, so no
#   workflow runs on the bot commit and nothing waits for approval; it reports visual / visual-shard as passed and copies every other check
#   and status of the tested head onto the bot commit; a notice names the missing secrets.
# Screenshot-only push: when a PR push changes only e2e/visual/__screenshots__/ (and e2e/visual/screen-files.json) since the last push, that push
#   was a baseline refresh ([update-visual-baselines]) and this workflow passed on it (scripts/ci/screenshot-only.sh --refresh), select picks
#   nothing: those are the baselines that run rendered and compared. Any other screenshot-only push (baselines committed by hand) compares as usual.
# Locally: pnpm prepush runs the layout checks on at most 12 selected screens; screenshots are never compared or committed from a local render.
on:
  pull_request:

concurrency:
  group: visual-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # actions: read for the screenshot-only check (reads this workflow's runs).
    permissions:
      contents: read
      actions: read
    outputs:
      update: ${{ steps.mode.outputs.update }}
      mode: ${{ steps.pick.outputs.mode }}
      grep: ${{ steps.pick.outputs.grep }}
      count: ${{ steps.pick.outputs.count }}
      radius: ${{ steps.pick.outputs.radius }}
      shards: ${{ steps.pick.outputs.shards }}
      total: ${{ steps.pick.outputs.total }}
    steps:
      - name: Choose compare or baseline refresh
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          update=false
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" = "$REPO" ]; then
            message=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq .commit.message)
            login=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq '.author.login // ""')
            name=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq .commit.author.name)
            if printf '%s' "$message" | grep -qF '[update-visual-baselines]'; then
              case "$login $name" in
                *"[bot]"*) echo "::notice::head commit by a bot ($login $name): no baseline refresh (loop guard)" ;;
                *) update=true ;;
              esac
            fi
          fi
          echo "update=$update" >> "$GITHUB_OUTPUT"
          echo "baseline refresh: $update"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # On a PR the checkout is the merge commit: its first parent is the base
      # it merges into, so HEAD^1..HEAD is exactly this PR's change. --pr caps
      # the run at 20 screens (one shard); a selection error runs the smoke
      # screens. mode=all on a PR means the selector itself broke: select fails.
      - name: Select screens
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/select.txt"
          : > "$out"
          if [ "$(scripts/ci/screenshot-only.sh visual-ci.yml --refresh)" = true ]; then
            echo "mode=none" >> "$out"
          else
            GITHUB_OUTPUT="$out" node --experimental-strip-types --no-warnings scripts/ci/visual-select.ts \
              --base HEAD^1 --head HEAD --pr --github-output || echo "mode=all" >> "$out"
          fi
          mode=$(grep '^mode=' "$out" | tail -1 | cut -d= -f2- || true)
          grep=$(grep '^grep=' "$out" | tail -1 | cut -d= -f2- || true)
          count=$(grep '^count=' "$out" | tail -1 | cut -d= -f2- || true)
          radius=$(grep '^radius=' "$out" | tail -1 | cut -d= -f2- || true)
          [ -z "$mode" ] && mode=all
          if [ "$mode" = all ]; then
            echo "::error::visual-select gave ALL on a pull request (the selector broke); a PR runs at most 20 screens"
            exit 1
          fi
          {
            echo "mode=$mode"
            echo "grep=$grep"
            echo "count=${count:-0}"
            echo "radius=${radius:-0}"
            echo "shards=[1]"
            echo "total=1"
          } >> "$GITHUB_OUTPUT"
          echo "visual: $mode, radius ${radius:-?} screens, running ${count:-?} in 1 shard"

  visual-shard:
    name: visual-shard (${{ matrix.shard }}/${{ needs.select.outputs.total }})
    needs: select
    if: needs.select.outputs.mode != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.select.outputs.shards) }}
    # Room for a slow apt mirror (see e2e-webkit.yml): the system-deps install
    # alone has taken 14 minutes on some runners.
    timeout-minutes: 30
    env:
      UPDATE: ${{ needs.select.outputs.update }}
      MODE: ${{ needs.select.outputs.mode }}
      GREP: ${{ needs.select.outputs.grep }}
      SHARD: ${{ matrix.shard }}/${{ needs.select.outputs.total }}
    steps:
      # A refresh renders the PR head itself (the commit the baselines land on);
      # a compare renders what checkout gives (the merge commit on a PR).
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.update == 'true' && github.event.pull_request.head.sha || '' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright WebKit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install webkit

      # The system packages come from the runner's apt mirror, which has been
      # slow enough (about 50 KB/s) to eat the whole job. Keep the downloaded
      # .deb files in the Actions cache so later runs install them offline.
      - name: Cache WebKit system packages
        id: deb-cache
        uses: actions/cache@v4
        with:
          path: ~/webkit-debs
          key: webkit-debs-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright WebKit system dependencies
        timeout-minutes: 18
        run: |
          set -euo pipefail
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-debs
          mkdir -p ~/webkit-debs
          if compgen -G "$HOME/webkit-debs/*.deb" > /dev/null; then
            sudo cp ~/webkit-debs/*.deb /var/cache/apt/archives/
          fi
          pnpm exec playwright install-deps webkit
          if [ "${{ steps.deb-cache.outputs.cache-hit }}" != 'true' ]; then
            cp /var/cache/apt/archives/*.deb ~/webkit-debs/ 2>/dev/null || true
          fi

      # The parts gallery also runs in Chromium (chrome-phone project,
      # playwright.visual.config.ts): its browser and system packages, cached
      # the same way as WebKit under their own keys.
      - name: Cache Playwright Chromium
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium

      - name: Cache Chromium system packages
        id: chromium-deb-cache
        uses: actions/cache@v4
        with:
          path: ~/chromium-debs
          key: chromium-debs-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium system dependencies
        timeout-minutes: 18
        run: |
          set -euo pipefail
          mkdir -p ~/chromium-debs
          if compgen -G "$HOME/chromium-debs/*.deb" > /dev/null; then
            sudo cp ~/chromium-debs/*.deb /var/cache/apt/archives/
          fi
          pnpm exec playwright install-deps chromium
          if [ "${{ steps.chromium-deb-cache.outputs.cache-hit }}" != 'true' ]; then
            cp /var/cache/apt/archives/*.deb ~/chromium-debs/ 2>/dev/null || true
          fi

      - name: Compare screens with the baselines
        if: env.UPDATE != 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          args=(--config e2e/visual/playwright.visual.config.ts --shard="$SHARD")
          if [ "$MODE" = some ]; then args+=(-g "$GREP"); fi
          pnpm exec playwright test "${args[@]}"

      # A PR re-renders only the screens it runs; every other baseline stays
      # (the nightly run refreshes the whole set).
      - name: Render new baselines
        if: env.UPDATE == 'true'
        timeout-minutes: 25
        run: |
          set -euo pipefail
          touch "$RUNNER_TEMP/render-start"
          args=(--config e2e/visual/playwright.visual.config.ts --shard="$SHARD")
          if [ "$MODE" = some ]; then args+=(-g "$GREP"); fi
          pnpm exec playwright test "${args[@]}" --update-snapshots=all

      # The bot commit's visual check: the same screens compared against the
      # baselines just rendered, on the same tree (layout checks run again too).
      - name: Compare the new baselines on the rendered tree
        if: env.UPDATE == 'true'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          args=(--config e2e/visual/playwright.visual.config.ts --shard="$SHARD")
          if [ "$MODE" = some ]; then args+=(-g "$GREP"); fi
          pnpm exec playwright test "${args[@]}" --update-snapshots=none

      # Only the files this shard rendered, so the artifacts merge with no
      # stale or duplicate file and no screen outside the selection.
      - name: Collect the rendered baselines
        if: env.UPDATE == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rendered"
          cd e2e/visual/__screenshots__
          find . -type f -name '*.png' -newer "$RUNNER_TEMP/render-start" -exec cp --parents {} "$RUNNER_TEMP/rendered/" \;
          echo "rendered: $(find "$RUNNER_TEMP/rendered" -type f | wc -l) files"

      - name: Upload new baselines
        if: env.UPDATE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ matrix.shard }}
          path: ${{ runner.temp }}/rendered
          if-no-files-found: warn
          retention-days: 7

      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-${{ matrix.shard }}
          path: |
            e2e/results/visual
            e2e/results/visual-report
          if-no-files-found: warn
          retention-days: 7

  # The required check: one name however many shards run. Passes when every
  # shard succeeded, or when the selection picked no screen (no shard runs);
  # fails on a failed, cancelled or skipped shard otherwise.
  visual:
    needs: [select, visual-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every shard passed
        env:
          SELECT: ${{ needs.select.result }}
          MODE: ${{ needs.select.outputs.mode }}
          SHARDS: ${{ needs.visual-shard.result }}
        run: |
          echo "select: $SELECT ($MODE), visual shards: $SHARDS"
          [ "$SELECT" = "success" ] || exit 1
          if [ "$MODE" = none ]; then [ "$SHARDS" = "skipped" ]; else [ "$SHARDS" = "success" ]; fi

  # Runs no PR code: it only lays the rendered images onto the head branch
  # (see the header).
  commit-baselines:
    needs: [select, visual-shard]
    if: needs.visual-shard.result == 'success' && needs.select.outputs.update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      checks: write
      statuses: write
      actions: read
    env:
      HAS_APP: ${{ secrets.SORTED_CI_APP_ID != '' && secrets.SORTED_CI_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Missing App secrets
        if: env.HAS_APP != 'true'
        run: echo "::notice::SORTED_CI_APP_ID and SORTED_CI_APP_PRIVATE_KEY are not both set; pushing with GITHUB_TOKEN and [skip ci], and reporting the bot commit's checks (no workflow runs on it)."

      # actions/create-github-app-token v3.3.0, pinned by commit.
      - name: App token (this repository, contents write)
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          app-id: ${{ secrets.SORTED_CI_APP_ID }}
          private-key: ${{ secrets.SORTED_CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app.outputs.token || github.token }}

      # The rendered files lay over the rest (a PR never clears the set).
      - uses: actions/download-artifact@v4
        with:
          pattern: visual-baselines-*
          merge-multiple: true
          path: e2e/visual/__screenshots__

      # The message never carries [update-visual-baselines] (loop guard).
      # Without the App it carries [skip ci]: nothing runs again on the bot
      # commit and GitHub asks for no approval; its checks are reported below.
      - name: Commit the baselines to the PR branch
        id: commit
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: |
          set -euo pipefail
          if [ -n "$APP_SLUG" ]; then
            uid=$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)
            git config user.name "${APP_SLUG}[bot]"
            git config user.email "${uid}+${APP_SLUG}[bot]@users.noreply.github.com"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          fi
          git add -A e2e/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "baselines unchanged: nothing to commit"
            exit 0
          fi
          if [ -n "$APP_SLUG" ]; then
            git commit -m "Visual CI: refresh baselines on the CI WebKit image"
          else
            git commit -m "Visual CI: refresh baselines on the CI WebKit image [skip ci]"
          fi
          git push origin "HEAD:$HEAD_REF"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Without the App: a GITHUB_TOKEN push starts no workflow, so the bot
      # commit ([skip ci]) would wait on its required checks forever. Visual
      # passes: the screens were rendered and compared on this tree. Every
      # other workflow's tree is the tested head's but for
      # e2e/visual/__screenshots__ (checked here), so its results there hold:
      # wait for them and copy each check run (and commit status) onto the bot
      # commit. With the App the push itself starts every PR workflow.
      - name: Report the checks for the bot commit
        if: steps.commit.outputs.sha != '' && env.HAS_APP != 'true'
        env:
          TOTAL: ${{ needs.select.outputs.total }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TESTED: ${{ github.event.pull_request.head.sha }}
          BOT: ${{ steps.commit.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=2 origin "$TESTED"
          other=$(git diff --name-only "$TESTED" "$BOT" | grep -v '^e2e/visual/__screenshots__/' || true)
          if [ -n "$other" ]; then
            echo "the bot commit changes more than the screenshots, reporting nothing:"
            echo "$other"
            exit 1
          fi
          post() {
            gh api -X POST "repos/$REPO/check-runs" \
              -f name="$1" -f head_sha="$BOT" -f status=completed -f conclusion="$2" \
              -f details_url="$3" -f "output[title]=$4" \
              -f "output[summary]=Bot baseline commit: $4 (tested head $TESTED)." > /dev/null
            echo "$1: $2"
          }
          for n in $(seq 1 "$TOTAL"); do
            post "visual-shard ($n/$TOTAL)" success "$RUN_URL" "rendered and compared on this tree"
          done
          post visual success "$RUN_URL" "rendered and compared on this tree"
          # The check suites of CI and Visual CI on the tested head are not copied.
          skip=$(gh api "repos/$REPO/actions/runs?head_sha=$TESTED&per_page=100" \
            --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml" or .path == ".github/workflows/visual-ci.yml") | .check_suite_id] | map(tostring) | join(" ")')
          runs() {
            gh api --paginate "repos/$REPO/commits/$TESTED/check-runs?per_page=100" \
              --jq '.check_runs[] | [(.check_suite.id | tostring), .name, .status, (.conclusion // ""), .html_url] | @tsv'
          }
          own() { case " $skip " in *" $1 "*) return 0 ;; *) return 1 ;; esac; }
          # Wait (up to 60 minutes) until every other check on the tested head is done.
          for i in $(seq 1 120); do
            pending=0
            while IFS=$'\t' read -r suite name status conclusion url; do
              [ -z "$name" ] && continue
              own "$suite" && continue
              [ "$status" != completed ] && pending=$((pending + 1))
            done < <(runs)
            [ "$pending" -eq 0 ] && break
            echo "waiting on $pending checks of $TESTED"
            sleep 30
          done
          # One result per check suite and name (the newest; the list is newest first).
          declare -A seen
          while IFS=$'\t' read -r suite name status conclusion url; do
            [ -z "$name" ] && continue
            own "$suite" && continue
            [ -n "${seen[$suite/$name]:-}" ] && continue
            seen[$suite/$name]=1
            if [ "$status" != completed ]; then
              echo "$name: still $status after 60 minutes, not reported"
              continue
            fi
            post "$name" "$conclusion" "$url" "copied from the tested head ($conclusion)"
          done < <(runs)
          # Commit statuses (non-Actions checks) carry over the same way.
          gh api "repos/$REPO/commits/$TESTED/status" \
            --jq '.statuses[] | [.context, .state, (.target_url // ""), (.description // "")] | @tsv' |
            while IFS=$'\t' read -r context state target description; do
              [ -z "$context" ] && continue
              [ "$state" = pending ] && continue
              gh api -X POST "repos/$REPO/statuses/$BOT" -f state="$state" -f context="$context" \
                -f target_url="$target" -f description="${description:0:120}" > /dev/null
              echo "status $context: $state"
            done
