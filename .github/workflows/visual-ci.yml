name: Visual CI

# visual-shard: renders every screen in e2e/visual/screens.spec.ts (iPhone 13 light and dark, 1280x800 light, four ipad-* tablet projects; WebKit, harness, no DB, no secrets) and compares each with its committed baseline in e2e/visual/__screenshots__/.
#   The suite is split into 4 parallel shards (playwright --shard=N/4, fullyParallel, so each test runs in exactly one shard). Any screen over 0.2% different fails; that shard's diff, actual and expected images upload as the visual-diffs-<N> artifact.
# visual: the one required check. It needs every shard and fails unless all four succeeded.
#   Runs on every pull request and every push to main (no paths filter, so the check always reports).
# Baseline refresh: on a pull request from this repo whose head commit message contains [update-visual-baselines], each shard clears the baselines and re-renders its own screens (--update-snapshots=all) on this CI WebKit image and uploads them as visual-baselines-<N>,
#   then compares its screens again against those fresh baselines on the same tree (a render that is not stable fails here, not on a later push).
#   commit-baselines merges all four artifacts into one full set and commits it to the PR's head branch. That push is made with GITHUB_TOKEN, so it starts no new run;
#   instead commit-baselines reports the checks for the bot commit itself (no new secret): the bot commit changes only e2e/visual/__screenshots__, so it waits for every
#   other check on the tested head commit to finish and copies each result onto the bot commit, and reports visual / visual-shard as passed (the screens were just
#   rendered and compared on this tree). The PR ends green on the bot commit with no human re-run. If anything but the screenshots differs, it reports nothing.
# Locally: pnpm exec playwright test --config e2e/visual/playwright.visual.config.ts (add --update-snapshots=all to refresh; local baselines differ from CI's, commit only CI-rendered ones).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: visual-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  visual-shard:
    name: visual-shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Room for a slow apt mirror (see e2e-webkit.yml): the system-deps install
    # alone has taken 14 minutes on some runners. The screen step renders a
    # quarter of the suite, so it gets 10.
    timeout-minutes: 30
    outputs:
      update: ${{ steps.mode.outputs.update }}
    steps:
      - name: Choose compare or baseline refresh
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          update=false
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" = "$REPO" ]; then
            message=$(gh api "repos/$REPO/commits/$HEAD_SHA" --jq .commit.message)
            if printf '%s' "$message" | grep -qF '[update-visual-baselines]'; then
              update=true
            fi
          fi
          echo "update=$update" >> "$GITHUB_OUTPUT"
          echo "baseline refresh: $update"

      # A refresh renders the PR head itself (the commit the baselines land on);
      # a compare renders what checkout gives (the merge commit on a PR).
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.mode.outputs.update == 'true' && github.event.pull_request.head.sha || '' }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright WebKit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install webkit

      # The system packages come from the runner's apt mirror, which has been
      # slow enough (about 50 KB/s) to eat the whole job. Keep the downloaded
      # .deb files in the Actions cache so later runs install them offline.
      - name: Cache WebKit system packages
        id: deb-cache
        uses: actions/cache@v4
        with:
          path: ~/webkit-debs
          key: webkit-debs-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright WebKit system dependencies
        timeout-minutes: 18
        run: |
          set -euo pipefail
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99keep-debs
          mkdir -p ~/webkit-debs
          if compgen -G "$HOME/webkit-debs/*.deb" > /dev/null; then
            sudo cp ~/webkit-debs/*.deb /var/cache/apt/archives/
          fi
          pnpm exec playwright install-deps webkit
          if [ "${{ steps.deb-cache.outputs.cache-hit }}" != 'true' ]; then
            cp /var/cache/apt/archives/*.deb ~/webkit-debs/ 2>/dev/null || true
          fi

      # Shard weights (PWTEST_SHARD_WEIGHTS, Playwright's per-shard share of the
      # test groups): shard 4 takes the tail of the suite (the laptop-dark and
      # ipad projects, the slowest screens per test) and was the slowest shard
      # (up to 9.6 of the 10 minutes), so it gets a smaller share.
      - name: Compare screens with the baselines
        if: steps.mode.outputs.update != 'true'
        timeout-minutes: 15
        env:
          PWTEST_SHARD_WEIGHTS: '26:26:26:22'
        run: pnpm exec playwright test --config e2e/visual/playwright.visual.config.ts --shard=${{ matrix.shard }}/4

      # Each shard uploads only the screens it rendered, so the checked-out
      # baselines go first (the .gitkeep stays); the four artifacts then merge
      # into one full set with no stale or duplicate files.
      - name: Clear the checked-out baselines
        if: steps.mode.outputs.update == 'true'
        run: find e2e/visual/__screenshots__ -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +

      - name: Render new baselines
        if: steps.mode.outputs.update == 'true'
        timeout-minutes: 25
        env:
          PWTEST_SHARD_WEIGHTS: '26:26:26:22'
        run: pnpm exec playwright test --config e2e/visual/playwright.visual.config.ts --shard=${{ matrix.shard }}/4 --update-snapshots=all

      # The bot commit's visual check: the same screens compared against the
      # baselines just rendered, on the same tree (layout checks run again too).
      - name: Compare the new baselines on the rendered tree
        if: steps.mode.outputs.update == 'true'
        timeout-minutes: 15
        env:
          PWTEST_SHARD_WEIGHTS: '26:26:26:22'
        run: pnpm exec playwright test --config e2e/visual/playwright.visual.config.ts --shard=${{ matrix.shard }}/4 --update-snapshots=none

      - name: Upload new baselines
        if: steps.mode.outputs.update == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ matrix.shard }}
          path: e2e/visual/__screenshots__
          if-no-files-found: error
          retention-days: 7

      - name: Upload diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs-${{ matrix.shard }}
          path: |
            e2e/results/visual
            e2e/results/visual-report
          if-no-files-found: warn
          retention-days: 7

  # The required check: one name however many shards run. Fails unless every
  # shard succeeded (a failed, cancelled or skipped shard fails it).
  visual:
    needs: visual-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check every shard passed
        env:
          SHARDS: ${{ needs.visual-shard.result }}
        run: |
          echo "visual shards: $SHARDS"
          [ "$SHARDS" = "success" ]

  # Runs no PR code: it only copies the rendered images onto the head branch,
  # then reports the bot commit's checks (see the header).
  commit-baselines:
    needs: visual-shard
    if: needs.visual-shard.result == 'success' && needs.visual-shard.outputs.update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      checks: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      # Replace the project folders only (the .gitkeep stays).
      - name: Clear the old baselines
        run: find e2e/visual/__screenshots__ -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +

      - uses: actions/download-artifact@v4
        with:
          pattern: visual-baselines-*
          merge-multiple: true
          path: e2e/visual/__screenshots__

      - name: Commit the baselines to the PR branch
        id: commit
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A e2e/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "baselines unchanged: nothing to commit"
            exit 0
          fi
          git commit -m "Visual CI: refresh baselines on the CI WebKit image"
          git push origin "HEAD:$HEAD_REF"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # A GITHUB_TOKEN push starts no workflow, so the bot commit would wait on
      # its required checks forever. Its tree differs from the tested head only
      # in e2e/visual/__screenshots__ (checked here), so every other check's
      # result on the tested head holds for it: wait for them to finish and copy
      # each one (check runs and commit statuses) onto the bot commit. The
      # visual checks pass: the screens were rendered and compared on this tree.
      - name: Report the checks for the bot commit
        if: steps.commit.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TESTED: ${{ github.event.pull_request.head.sha }}
          BOT: ${{ steps.commit.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=2 origin "$TESTED"
          other=$(git diff --name-only "$TESTED" "$BOT" | grep -v '^e2e/visual/__screenshots__/' || true)
          if [ -n "$other" ]; then
            echo "the bot commit changes more than the screenshots, reporting nothing:"
            echo "$other"
            exit 1
          fi
          own() { case "$1" in visual|visual-shard*|commit-baselines) return 0 ;; *) return 1 ;; esac; }
          runs() {
            gh api --paginate "repos/$REPO/commits/$TESTED/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // ""), .html_url] | @tsv'
          }
          # Wait (up to 60 minutes) until every other check on the tested head is done.
          for i in $(seq 1 120); do
            pending=0
            while IFS=$'\t' read -r name status conclusion url; do
              [ -z "$name" ] && continue
              own "$name" && continue
              [ "$status" != completed ] && pending=$((pending + 1))
            done < <(runs)
            [ "$pending" -eq 0 ] && break
            echo "waiting on $pending checks of $TESTED"
            sleep 30
          done
          post() {
            gh api -X POST "repos/$REPO/check-runs" \
              -f name="$1" -f head_sha="$BOT" -f status=completed -f conclusion="$2" \
              -f details_url="$3" -f "output[title]=$4" \
              -f "output[summary]=Bot baseline commit: $4 (tested head $TESTED)." > /dev/null
            echo "$1: $2"
          }
          # Only the newest run of each name counts (a re-run replaces the old one).
          declare -A seen
          while IFS=$'\t' read -r name status conclusion url; do
            [ -z "$name" ] && continue
            own "$name" && continue
            [ -n "${seen[$name]:-}" ] && continue
            seen[$name]=1
            if [ "$status" != completed ]; then
              echo "$name: still $status after 60 minutes, not reported"
              continue
            fi
            post "$name" "$conclusion" "$url" "copied from the tested head ($conclusion)"
          done < <(runs)
          for n in 1 2 3 4; do
            post "visual-shard ($n/4)" success "$RUN_URL" "rendered and compared on this tree"
          done
          post visual success "$RUN_URL" "rendered and compared on this tree"
          # Commit statuses (non-Actions checks) carry over the same way.
          gh api "repos/$REPO/commits/$TESTED/status" \
            --jq '.statuses[] | [.context, .state, (.target_url // ""), (.description // "")] | @tsv' |
            while IFS=$'\t' read -r context state target description; do
              [ -z "$context" ] && continue
              [ "$state" = pending ] && continue
              gh api -X POST "repos/$REPO/statuses/$BOT" -f state="$state" -f context="$context" \
                -f target_url="$target" -f description="${description:0:120}" > /dev/null
              echo "status $context: $state"
            done
