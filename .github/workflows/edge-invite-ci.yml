name: Edge Invite CI

# Runs the member-invite edge function's pure unit tests (lib.ts) under Vitest.
# lib.ts has no Deno globals and no network, so it runs in plain Node; this gate
# is independent of the live Supabase stack and never deploys the function.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  edge-invite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run member-invite lib unit tests
        run: pnpm exec vitest run supabase/functions/member-invite/lib.test.ts
