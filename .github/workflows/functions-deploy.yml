name: deploy-edge-functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy invite-send
        run: supabase functions deploy invite-send --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Deploy invite-accept
        run: supabase functions deploy invite-accept --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Deploy brand-request-send
        run: supabase functions deploy brand-request-send --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Deploy catchup-unsubscribe
        run: supabase functions deploy catchup-unsubscribe --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Deploy book-call-send
        run: supabase functions deploy book-call-send --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Deploy demo-request-send
        run: supabase functions deploy demo-request-send --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Deploy resend-webhook
        run: supabase functions deploy resend-webhook --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Deploy ops-cockpit
        run: supabase functions deploy ops-cockpit --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --no-verify-jwt
