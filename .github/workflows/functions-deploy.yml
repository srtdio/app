name: deploy-edge-functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy invite-send
        run: supabase functions deploy invite-send --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - name: Deploy invite-accept
        run: supabase functions deploy invite-accept --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
