name: RPC Procs

# Spins up a local Supabase stack, applies supabase/migrations/ (including the
# SECURITY DEFINER write procs), and runs the proc E2E suite as the authenticated
# role. Independent of schema-drift.yml and rls-ci.yml.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  rpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check the RPC wrapper and test workspace
        run: pnpm exec tsc -p tests/rpc/tsconfig.json --noEmit

      - name: Run RPC proc suite
        run: pnpm exec vitest run --config tests/rpc/vitest.config.ts

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup || true
