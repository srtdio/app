<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Guest homepage canvas: "/" for a guest is light only, so paint it white
         before the dark-mode canvas below can show. This logic mirrors
         isGuestHome in src/components/home/guest-path.ts and must stay in sync.
         Every other case keeps the canvas from the <style> below. -->
    <script>
      (function () {
        var hasSession = false;
        try {
          for (var i = 0; i < localStorage.length; i++) {
            if (/^sb-.+-auth-token$/.test(localStorage.key(i) || '')) hasSession = true;
          }
        } catch (e) {
          hasSession = false;
        }
        // "/" is served prerendered homepage markup (scripts/prerender.ts). A
        // signed-in visit boots the app instead, so that markup and its
        // stylesheet are removed as the parser inserts them: observer callbacks
        // run before the browser can paint, so not one frame of it shows. The
        // CSS rule below hides it too, should a callback ever come late.
        function dropPrerenderedHome() {
          document.documentElement.classList.add('boot-app');
          var clear = function () {
            var root = document.querySelector('#root[data-prerender="home"]');
            if (root) root.textContent = '';
            document.querySelectorAll('link[data-prerender-css]').forEach(function (el) {
              el.remove();
            });
            return root;
          };
          var observer = new MutationObserver(clear);
          observer.observe(document.documentElement, { childList: true, subtree: true });
          document.addEventListener('DOMContentLoaded', function () {
            observer.disconnect();
            var root = clear();
            if (root) root.removeAttribute('data-prerender');
            document.documentElement.classList.remove('boot-app');
          });
        }
        var callback = /(?:^|[?&#])(?:code|type)=|access_token|refresh_token|error_description/;
        // isHomeBundlePath: /pricing and /demo are light for everyone.
        var homeBundlePath = location.pathname === '/pricing' || location.pathname === '/demo';
        if (
          !homeBundlePath &&
          (location.pathname !== '/' ||
            hasSession ||
            callback.test(location.search) ||
            callback.test(location.hash))
        ) {
          if (location.pathname === '/') dropPrerenderedHome();
          return;
        }
        var white = '#ffffff'; /* homepage background, src/components/home/home.css */
        document.documentElement.style.backgroundColor = white;
        // First theme-color meta in tree order wins, so this one beats the
        // media-split tags parsed below; those are synced once parsed.
        var meta = document.createElement('meta');
        meta.name = 'theme-color';
        meta.content = white;
        document.head.appendChild(meta);
        document.addEventListener('DOMContentLoaded', function () {
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (el) {
            el.setAttribute('content', white);
          });
        });
      })();
    </script>
    <!-- Critical paint: set the html canvas before the built stylesheet loads to
         kill the pre-CSS flash on iOS Safari. Light for everyone; dark only when
         the person picked it (localStorage sorted-theme, src/lib/theme.ts). Hex
         mirrors --bg in src/index.css; once loaded, html { background: var(--bg) }
         takes over. -->
    <style>
      html {
        background-color: #f7f8f9; /* --bg light, src/index.css :root */
      }
      html.pre-dark {
        background-color: #0c0d10; /* --bg dark, src/index.css .dark */
      }
      html.boot-app #root[data-prerender='home'] {
        display: none;
      }
    </style>
    <script>
      try {
        if (localStorage.getItem('sorted-theme') === 'dark') {
          document.documentElement.classList.add('pre-dark');
          // Prerendered legal pages paint app markup before the app boots, so
          // theme it now; src/lib/theme.ts sets the same class once it runs.
          if (location.pathname.indexOf('/legal/') === 0) {
            document.documentElement.classList.add('dark');
          }
        }
      } catch (e) {
        /* storage blocked: stay light */
      }
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!-- Tint the Safari toolbar to match the canvas so a collapsing toolbar never
         exposes a mismatched band. Hex mirrors --bg in src/index.css; manual theme
         toggles override this via src/lib/theme.ts. -->
    <meta name="theme-color" content="#f7f8f9" />
    <!-- content = --bg light, src/index.css :root; a dark choice is synced by src/lib/theme.ts -->
    <title>Sorted</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
