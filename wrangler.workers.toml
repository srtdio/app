# Workers config. Used by future Worker deploys in batch B4. Pages deploys use wrangler.toml.
compatibility_date = "2026-05-16"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1.0

# Idempotency-key cleanup. Daily 03:00 UTC: deletes idempotency_keys rows whose
# expires_at has passed. Handler: src/server/cron/idempotency-cleanup.ts.
[triggers]
crons = ["0 3 * * *"]
