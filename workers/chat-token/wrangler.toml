name = "chat-token"
main = "../../src/server/workers/chat-token.ts"
compatibility_date = "2026-05-16"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGINS = "https://srtd.io,https://srtdio-app.pages.dev"

# Structured logs to stdout; Cloudflare Logpush ships them to the R2 sink
# srtdio-logs (see docs/cloudflare-logpush-setup.md).
[observability]
enabled = true
head_sampling_rate = 1.0

# All values are supplied as Worker secrets (wrangler secret put / CI), never
# committed. Only binding names live here:
#   AGORA_APP_ID         - Agora App ID; pairs with the certificate to sign tokens
#   AGORA_APP_CERTIFICATE - Agora App Certificate; Chat token signing secret
#   AGORA_CHAT_APP_KEY   - Agora Chat App Key; the frontend needs it to init the SDK
#   AGORA_CHAT_REST_URL  - Agora Chat REST base URL (host + org + app)
#   SUPABASE_URL         - project URL for the membership read
#   SUPABASE_SECRET_KEY  - service role: workspace_members read
#   ALLOWED_ORIGINS      - optional CORS allowlist (comma-separated origins)
