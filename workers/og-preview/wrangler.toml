name = "srtdio-og-preview"
main = "../../src/server/workers/og-preview.ts"
compatibility_date = "2026-05-16"
compatibility_flags = ["nodejs_compat"]

# Zone routes in front of Pages. Workers routes take precedence over the Pages
# custom domain, so this Worker intercepts post links (for crawler OG cards and
# human passthrough) and the image endpoint, while Pages serves everything else.
routes = [
  { pattern = "srtd.io/posts/*", zone_name = "srtd.io" },
  { pattern = "srtd.io/og/*", zone_name = "srtd.io" },
  { pattern = "srtd.io/p/*", zone_name = "srtd.io" },
  { pattern = "srtd.io/b/*", zone_name = "srtd.io" },
]

[vars]
PAGES_ORIGIN = "https://srtdio-app.pages.dev"

# Structured logs to stdout; Cloudflare Logpush ships them to the R2 sink
# srtdio-logs (see docs/cloudflare-logpush-setup.md).
[observability]
enabled = true
head_sampling_rate = 1.0

# All values are supplied as Worker secrets (wrangler secret put / CI), never
# committed. Only binding names live here (identical to asset-read):
#   CLOUDFLARE_ACCOUNT_ID           - R2 S3 endpoint host
#   CLOUDFLARE_R2_ACCESS_KEY_ID     - R2 SigV4 access key
#   CLOUDFLARE_R2_SECRET_ACCESS_KEY - R2 SigV4 secret
#   SUPABASE_URL                    - project URL for the service-role lookups
#   SUPABASE_SECRET_KEY             - service role: post + attachment reads
