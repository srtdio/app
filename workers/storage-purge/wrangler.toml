name = "storage-purge"
main = "../../src/server/cron/storage-purge.ts"
compatibility_date = "2026-05-16"
compatibility_flags = ["nodejs_compat"]

# Nightly 03:30 UTC: removes the R2 bytes of purged assets, then tears down
# workspaces deleted more than 30 days ago (Agora groups, bucket objects,
# rows; buckets are never deleted).
# Handler: src/server/cron/storage-purge.ts.
[triggers]
crons = ["30 3 * * *"]

[vars]
# The one private Asia-Pacific bucket for workspace files (not a secret).
SHARED_ASSET_BUCKET = "srtdio-files"

# Structured logs to stdout; Cloudflare Logpush ships them to the R2 sink
# srtdio-logs (see docs/cloudflare-logpush-setup.md).
[observability]
enabled = true
head_sampling_rate = 1.0

# All values are supplied as Worker secrets (wrangler secret put / CI), never
# committed. Only binding names live here:
#   CLOUDFLARE_ACCOUNT_ID           - R2 account; the S3 endpoint host
#   CLOUDFLARE_R2_ACCESS_KEY_ID     - R2 S3 access key: object deletes
#   CLOUDFLARE_R2_SECRET_ACCESS_KEY - R2 S3 secret key (SigV4 signing)
#   SUPABASE_URL                    - project URL for the purge rpcs and chat_channels reads
#   SUPABASE_SECRET_KEY             - service role: the purge rpcs are granted to service_role only
#   AGORA_APP_ID                    - Agora App ID; pairs with the certificate to sign tokens
#   AGORA_APP_CERTIFICATE           - Agora App Certificate; REST app-token signing secret
#   AGORA_CHAT_REST_URL             - Agora Chat REST base URL (host + org + app)
