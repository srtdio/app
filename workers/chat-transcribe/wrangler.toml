name = "chat-transcribe"
main = "../../src/server/workers/chat-transcribe.ts"
compatibility_date = "2026-05-16"
compatibility_flags = ["nodejs_compat"]

# Workers AI binding; the worker calls env.AI.run(whisper-large-v3-turbo).
[ai]
binding = "AI"

# Daily byte counter (usage:YYYY-MM-DD) that caps Workers AI spend at 240 MB of
# audio per UTC day. Namespace chat_transcribe_usage (an id is not a secret).
[[kv_namespaces]]
binding = "TRANSCRIBE_USAGE"
id = "3aa4f55803c44c7c9cb9fe0764c3eba8"

[vars]
ALLOWED_ORIGINS = "https://srtd.io,https://srtdio-app.pages.dev"

# Structured logs to stdout; Cloudflare Logpush ships them to the R2 sink
# srtdio-logs (see docs/cloudflare-logpush-setup.md).
[observability]
enabled = true
head_sampling_rate = 1.0

# All values are supplied as Worker secrets (wrangler secret put / CI), never
# committed. Only binding names live here. Caller JWTs are verified the same way
# chat-token verifies its caller - against the project's published ES256 JWKS -
# so no shared secret is held; the project URL is the only verification input:
#   SUPABASE_URL          - project URL; its published JWKS verifies caller tokens
#   CLOUDFLARE_ACCOUNT_ID - required; the worker fetches audio only from
#                           https://<CLOUDFLARE_ACCOUNT_ID>.r2.cloudflarestorage.com
#                           (the host presigned R2 URLs are signed for)
#   ALLOWED_ORIGINS       - optional CORS allowlist (comma-separated origins)
