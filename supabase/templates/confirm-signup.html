<html>
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<style>
  body { margin:0; padding:0; }
  @media (prefers-color-scheme: dark) {
    .bg    { background-color:#0c0d10 !important; }
    .panel { background-color:#141519 !important; border-color:#23262c !important; }
    .t-fg  { color:#f4f5f6 !important; }
    .t-fg2 { color:#9aa0a8 !important; }
    .t-fg3 { color:#6b7178 !important; }
    .rule  { background-color:#23262c !important; }
    .code  { background-color:#0c0d10 !important; border-color:#23262c !important; }
  }
</style>
</head>
<body class="bg" style="margin:0;padding:0;background-color:#f7f8f9;">
<table role="presentation" class="bg" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f7f8f9;">
  <tr>
    <td align="center" style="padding:36px 12px;">
      <table role="presentation" class="panel" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#ffffff;border:1px solid #e6e8eb;border-radius:14px;">
        <tr>
          <td style="padding:36px 28px 28px;">

            <div class="t-fg" style="font-family:-apple-system,'Segoe UI',Arial,sans-serif;font-size:20px;font-weight:600;letter-spacing:-0.01em;color:#1b1c20;">srtd.</div>

            <div class="t-fg2" style="padding-top:26px;font-family:-apple-system,'Segoe UI',Arial,sans-serif;font-size:14px;line-height:1.55;color:#62666d;">Enter this code in Sorted to sign in.</div>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td align="center" style="padding-top:20px;">
                  <table role="presentation" cellpadding="0" cellspacing="0">
                    <tr>
                      <td class="code t-fg" align="center" style="padding:16px 24px;background-color:#f7f8f9;border:1px solid #e6e8eb;border-radius:12px;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:32px;font-weight:600;letter-spacing:0.3em;color:#1b1c20;">{{ .Token }}</td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>

            <div class="t-fg2" style="padding-top:20px;font-family:-apple-system,'Segoe UI',Arial,sans-serif;font-size:14px;line-height:1.55;color:#62666d;">The code expires in 1 hour.</div>
            <div class="t-fg2" style="padding-top:4px;font-family:-apple-system,'Segoe UI',Arial,sans-serif;font-size:14px;line-height:1.55;color:#62666d;">Don&rsquo;t share it with anyone.</div>

            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="padding-top:28px;"><div class="rule" style="height:1px;background-color:#e6e8eb;font-size:0;line-height:1px;">&nbsp;</div></td>
              </tr>
              <tr>
                <td class="t-fg3" style="padding-top:16px;font-family:-apple-system,'Segoe UI',Arial,sans-serif;font-size:12px;line-height:1.6;color:#8b9096;">Didn&rsquo;t ask for this? Ignore this email.</td>
              </tr>
              <tr>
                <td class="t-fg3" style="padding-top:12px;font-family:-apple-system,'Segoe UI',Arial,sans-serif;font-size:12px;color:#8b9096;">Sent to <span class="t-fg2" style="color:#62666d;">{{ .Email }}</span> &middot; srtd.io</td>
              </tr>
            </table>

          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
